[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-router-lint"
version = "0.1.0"
description = "Cross-resource security and reliability linter for Agent Router (formerly Envoy AI Gateway) manifests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shriram K Vasudevan" }]
keywords = ["agent-router", "envoy-ai-gateway", "aaif", "kubernetes", "llm-gateway", "mcp", "lint"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/shriramkv/agent-router-lint"

[project.scripts]
agent-router-lint = "agent_router_lint.cli:main"

[tool.setuptools]
packages = ["agent_router_lint"]

[tool.setuptools.package-data]
agent_router_lint = ["samples/*.yaml"]
