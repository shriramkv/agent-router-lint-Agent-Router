# A hardened Agent Router setup: authenticated + TLS-validated providers,
# failover, token accounting, token-based rate limiting, and an MCP route
# behind OAuth with a tool allow-list. Expected grade: A.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: agents
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: chat
  namespace: agents
spec:
  parentRefs:
    - name: ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o-mini
      backendRefs:
        - name: openai
          priority: 0
        - name: azure-openai
          priority: 1
      timeouts:
        request: 120s
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openai
  namespace: agents
spec:
  schema:
    name: OpenAI
  backendRef:
    name: openai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: azure-openai
  namespace: agents
spec:
  schema:
    name: AzureOpenAI
  backendRef:
    name: azure-openai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-apikey
  namespace: agents
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openai
  type: APIKey
  apiKey:
    secretRef:
      name: openai-apikey
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: azure-apikey
  namespace: agents
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: azure-openai
  type: AzureAPIKey
  azureAPIKey:
    secretRef:
      name: azure-apikey
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openai
  namespace: agents
spec:
  endpoints:
    - fqdn:
        hostname: api.openai.com
        port: 443
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: azure-openai
  namespace: agents
spec:
  endpoints:
    - fqdn:
        hostname: contoso.openai.azure.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: provider-tls
  namespace: agents
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: openai
    - group: gateway.envoyproxy.io
      kind: Backend
      name: azure-openai
  validation:
    wellKnownCACertificates: System
    hostname: api.openai.com
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: token-budget
  namespace: agents
spec:
  targetRefs:
    - name: ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-tenant-id
                  type: Distinct
          limit:
            requests: 200000
            unit: Hour
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: tools
  namespace: agents
spec:
  parentRefs:
    - name: ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  path: /mcp
  securityPolicy:
    oauth:
      issuer: https://auth.example.com/realms/agents
      jwks:
        remoteJWKS:
          uri: https://auth.example.com/realms/agents/protocol/openid-connect/certs
  backendRefs:
    - name: github-mcp
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp/readonly
      toolSelector:
        includeRegex:
          - .*issues?.*
      securityPolicy:
        apiKey:
          secretRef:
            name: github-token
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: github-mcp
  namespace: agents
spec:
  endpoints:
    - fqdn:
        hostname: api.githubcopilot.com
        port: 443
